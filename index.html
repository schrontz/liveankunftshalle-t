<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Klassifikation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#F2EDE4;
    --ink:#000;
    --dim:rgba(242,237,228,.42);
    --line:1.5px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000;color:var(--bone);
    font-family:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",sans-serif;
    display:grid;place-items:center;overflow:hidden;cursor:default;
  }
  body.hide-cursor{cursor:none}

  #stage{position:relative;max-width:100vw;max-height:100vh;aspect-ratio:16/9}
  #cam{display:block;width:100%;height:100%;object-fit:cover;background:#000}
  #cam.mirror{transform:scaleX(-1)}
  #overlay{position:absolute;inset:0;width:100%;height:100%}

  /* Start */
  #start{position:fixed;inset:0;display:grid;place-content:center;gap:22px;
    background:#000;padding:32px;text-align:left;max-width:520px;margin:auto}
  #start h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
  #start p{color:var(--dim);font-size:16px;line-height:1.5;max-width:44ch}
  button{
    font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--bone);
    border:0;padding:12px 20px;cursor:pointer;justify-self:start
  }
  button:hover{background:#fff}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
  select,input[type=range]{font:inherit;color:var(--bone);background:transparent;
    border:1px solid var(--dim);padding:6px 8px;max-width:100%}
  select option{background:#000}

  /* HUD */
  #hud{position:fixed;top:18px;left:20px;font-size:14px;line-height:1.6;color:var(--dim);
    pointer-events:none;font-variant-numeric:tabular-nums}
  #hud b{color:var(--bone);font-weight:600}
  #panel{position:fixed;bottom:18px;left:20px;right:20px;display:flex;flex-wrap:wrap;
    gap:8px 20px;align-items:center;font-size:14px;color:var(--dim)}
  #panel label{display:flex;gap:8px;align-items:center}
  #keys{position:fixed;bottom:18px;right:20px;font-size:13px;color:var(--dim);text-align:right;
    pointer-events:none}
  .off{display:none !important}
  #err{position:fixed;top:0;left:0;right:0;padding:14px 20px;background:var(--bone);color:#000;font-size:15px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div id="stage" class="off">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="start">
  <h1>Live-Klassifikation</h1>
  <p>Die Kamera läuft nur lokal auf diesem Rechner. Erkannte Objekte bekommen einen Kasten und ein Label.</p>
  <label style="color:var(--dim);display:flex;flex-direction:column;gap:6px">Kamera
    <select id="camPick"><option value="">Standardkamera</option></select>
  </label>
  <button id="go">Kamera starten</button>
</div>

<div id="hud" class="off"></div>

<div id="panel" class="off">
  <label>Schwelle <input id="thr" type="range" min="10" max="90" value="40" step="5"><span id="thrV">40%</span></label>
  <label>Kamera <select id="camPick2"></select></label>
  <label>Labels <select id="mode">
    <option value="2">Name + Wert</option>
    <option value="1">nur Name</option>
    <option value="0">nur Kasten</option>
  </select></label>
  <label><input id="mir" type="checkbox"> Spiegeln</label>
</div>

<div id="keys" class="off">H Bedienung &nbsp; F Vollbild &nbsp; M Spiegeln &nbsp; ↑ ↓ Schwelle</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const video = $('#cam'), cv = $('#overlay'), ctx = cv.getContext('2d');
let model, tracks = [], nextId = 1, threshold = .40, labelMode = 2, mirror = false;
let fps = 0, lastT = performance.now(), running = false, lastErr = '';

function fail(msg){
  const d = document.createElement('div');
  d.id = 'err'; d.textContent = msg;
  document.body.appendChild(d);
}

/* ---------- Kamera ---------- */
async function listCams(){
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  for (const sel of [$('#camPick'), $('#camPick2')]){
    sel.innerHTML = '';
    devs.forEach((d,i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || ('Kamera ' + (i+1));
      sel.appendChild(o);
    });
  }
}

async function openCam(deviceId){
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const size = {width:{ideal:1280}, height:{ideal:720}};
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? Object.assign({deviceId:{exact:deviceId}}, size) : size,
      audio: false
    });
  } catch(e){
    // gewähltes Gerät nicht verfügbar -> Standardkamera
    if (!deviceId) throw e;
    stream = await navigator.mediaDevices.getUserMedia({video:size, audio:false});
  }
  video.srcObject = stream;
  await video.play();
  if (!video.videoWidth){                       // Maße kommen manchmal verspätet
    await new Promise(r => video.addEventListener('loadedmetadata', r, {once:true}));
  }
  syncSize();
  await listCams();
}

function syncSize(){
  if (!video.videoWidth) return;
  if (cv.width !== video.videoWidth || cv.height !== video.videoHeight){
    cv.width = video.videoWidth; cv.height = video.videoHeight;
    $('#stage').style.aspectRatio = video.videoWidth + '/' + video.videoHeight;
  }
}

/* ---------- Tracking: Boxen ruhig halten ---------- */
const iou = (a,b) => {
  const x1 = Math.max(a[0],b[0]), y1 = Math.max(a[1],b[1]);
  const x2 = Math.min(a[0]+a[2], b[0]+b[2]), y2 = Math.min(a[1]+a[3], b[1]+b[3]);
  const i = Math.max(0,x2-x1) * Math.max(0,y2-y1);
  return i / (a[2]*a[3] + b[2]*b[3] - i || 1);
};

function update(preds){
  tracks.forEach(t => t.seen = false);
  for (const p of preds){
    let best = null, bestScore = .25;
    for (const t of tracks){
      if (t.cls !== p.class || t.seen) continue;
      const s = iou(t.box, p.bbox);
      if (s > bestScore){ bestScore = s; best = t; }
    }
    if (best){
      best.box = best.box.map((v,i) => v + (p.bbox[i]-v) * .35);
      best.score += (p.score - best.score) * .3;
      best.seen = true; best.miss = 0; best.alpha = Math.min(1, best.alpha + .18);
    } else {
      tracks.push({id:nextId++, cls:p.class, box:p.bbox.slice(), score:p.score, seen:true, miss:0, alpha:.3});
    }
  }
  for (const t of tracks) if (!t.seen){ t.miss++; t.alpha -= .12; }
  tracks = tracks.filter(t => t.miss < 8 && (t.seen || t.alpha > 0));
}

/* ---------- Zeichnen ---------- */
function draw(){
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const s = W / 1280;                       // Skalierung auf Auflösung
  const fs = Math.max(13, Math.round(19*s));
  ctx.lineWidth = Math.max(1.5, 2*s);
  ctx.font = '600 ' + fs + 'px "IBM Plex Sans Condensed", sans-serif';
  ctx.textBaseline = 'alphabetic';

  for (const t of tracks){
    let [x,y,w,h] = t.box;
    if (mirror) x = W - x - w;
    const a = Math.max(0, Math.min(1, t.alpha));
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#F2EDE4';
    ctx.strokeRect(x, y, w, h);

    if (labelMode > 0){
      const txt = labelMode === 2
        ? t.cls + '  ' + Math.round(t.score*100)
        : t.cls;
      const padX = 7*s, padY = 5*s;
      const tw = ctx.measureText(txt).width;
      const bh = fs + padY*2;
      const by = y - bh < 0 ? y : y - bh;   // Label nach innen, wenn oben kein Platz
      ctx.fillStyle = '#F2EDE4';
      ctx.fillRect(x, by, tw + padX*2, bh);
      ctx.fillStyle = '#000';
      ctx.fillText(txt, x + padX, by + bh - padY - 2*s);
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- Schleife ---------- */
async function loop(){
  if (!running) return;
  syncSize();
  if (video.readyState >= 2 && cv.width){
    let raw = [];
    try {
      raw = await model.detect(video, 20, .12);      // niedrig abfragen, lokal filtern
      lastErr = '';
    } catch(e){ lastErr = e.name + ': ' + e.message; }
    update(raw.filter(p => p.score >= threshold));
    draw();
    const now = performance.now();
    fps += ((1000/(now-lastT)) - fps) * .15; lastT = now;
    $('#hud').innerHTML = '<b>v3</b> · <b>' + tracks.length + '</b> über Schwelle · ' + raw.length + ' roh<br>' +
      Math.round(fps) + ' fps · Schwelle ' + Math.round(threshold*100) + '% · ' +
      cv.width + '×' + cv.height +
      (lastErr ? '<br>Fehler: ' + lastErr : '');
  } else {
    $('#hud').innerHTML = 'warte auf Kamerabild …';
  }
  requestAnimationFrame(loop);
}

/* ---------- Start ---------- */
$('#go').addEventListener('click', async () => {
  const btn = $('#go');
  btn.disabled = true; btn.textContent = 'Modell wird geladen …';
  try {
    await openCam($('#camPick').value || undefined);
    model = await cocoSsd.load({base:'mobilenet_v2'});
    await model.detect(video, 1, .9);           // Warmlauf
  } catch(e){
    btn.disabled = false; btn.textContent = 'Kamera starten';
    const hinweis = {
      NotAllowedError: 'Der Browser hat den Kamerazugriff blockiert. Auf das Schloss-Symbol links in der Adresszeile klicken und Kamera erlauben.',
      NotFoundError: 'Keine Kamera gefunden.',
      NotReadableError: 'Die Kamera wird von einem anderen Programm benutzt (Zoom, OBS, Teams). Das dort beenden.',
      OverconstrainedError: 'Die gewählte Kamera ist nicht verfügbar.'
    }[e.name] || (e.name + ': ' + e.message);
    fail(hinweis + ' Die Seite muss über http://localhost oder https:// laufen — per Doppelklick geöffnet sperrt der Browser die Kamera.');
    return;
  }
  $('#start').classList.add('off');
  ['#stage','#hud','#panel','#keys'].forEach(s => $(s).classList.remove('off'));
  running = true; loop();
});

/* ---------- Bedienung ---------- */
$('#thr').addEventListener('input', e => {
  threshold = e.target.value/100; $('#thrV').textContent = e.target.value + '%';
});
$('#mode').addEventListener('change', e => labelMode = +e.target.value);
$('#mir').addEventListener('change', e => setMirror(e.target.checked));
$('#camPick2').addEventListener('change', e => openCam(e.target.value).catch(err => fail(err.message)));

function setMirror(on){
  mirror = on; video.classList.toggle('mirror', on); $('#mir').checked = on;
}
function togglePanel(){
  const hidden = $('#panel').classList.toggle('off');
  $('#hud').classList.toggle('off', hidden);
  $('#keys').classList.toggle('off', hidden);
  document.body.classList.toggle('hide-cursor', hidden);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') togglePanel();
  if (k === 'm') setMirror(!mirror);
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    const step = e.key === 'ArrowUp' ? 5 : -5;
    $('#thr').value = Math.min(90, Math.max(10, +$('#thr').value + step));
    $('#thr').dispatchEvent(new Event('input'));
  }
});

navigator.mediaDevices?.enumerateDevices && listCams();
</script>
</body>
</html>
